{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PolarOps | Polar Expedition Logistics &amp; Asset Management Portal{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}PolarOps — Official Polar Expedition Logistics and Asset Management Portal for scientific and field research operations.{% endblock %}">

  <!-- Google Fonts: Inter & Noto Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v4 Play CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Force Tailwind v4 class-based dark mode -->
  <style type="text/tailwindcss">
    @variant dark (&:where(.dark, .dark *));
  </style>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <!-- Theme Init (respects saved preference or OS preference before body renders) -->
  <script>
    (function () {
      var saved = localStorage.getItem('polarops-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-[#F8FAFC] dark:bg-[#0B1220] text-[#0F172A] dark:text-[#F8FAFC] transition-colors duration-200 antialiased selection:bg-[#DCFCE7] selection:text-[#14532D] dark:selection:bg-[#15803D]/40 dark:selection:text-[#DCFCE7]">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  {% block content %}{% endblock %}

  <script src="{% static 'js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
